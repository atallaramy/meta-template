repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      # --fix mode validates frontmatter, auto-clears stale blocked_by entries
      # (references to tickets in tickets/done/), regenerates INDEX, auto-ticks
      # PROD-READINESS if present, and `git add`s any touched files so the
      # human sees them in the commit. Replaces the older --validate+--check
      # hook pair locally; CI workflows keep the granular layout for defense
      # in depth against --no-verify / external edits / force-pushes.
      - id: tickets-fix-and-index
        name: tickets — auto-clear stale blocked_by + regen INDEX
        entry: python scripts/build_index.py --fix
        language: system
        pass_filenames: false
        files: ^(tickets/|hotfix/|epics/|GOVERNANCE\.md|PROD-READINESS\.md|INDEX\.md|INDEX\.json)
